services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/tfg_project
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
