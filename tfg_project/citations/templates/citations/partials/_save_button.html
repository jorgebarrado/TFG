<div id="save-button-{{ citation.id }}">
    <button hx-post="{% url 'toggle_saved' %}" hx-target="#save-button-{{ citation.id }}" hx-swap="outerHTML"
            hx-vals='{"citation_id": "{{ citation.id }}"}'
            class="btn btn-sm {% if is_saved %}btn-success{% else %}btn-outline-success{% endif %}">
        <i class="bi bi-bookmark{% if is_saved %}-fill{% endif %}"></i>
        {% if is_saved %}Guardado{% else %}Guardar{% endif %}
    </button>
</div>
