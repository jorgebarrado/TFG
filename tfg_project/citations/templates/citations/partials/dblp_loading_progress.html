<div
  id="dblp-load-progress"
  class="extract-progress d-none"
  role="status"
  aria-live="polite"
  data-dblp-loading-progress
>
  <div class="extract-progress-head">
    <div
      class="spinner-border spinner-border-sm text-primary extract-progress-spinner"
      role="status"
      aria-hidden="true"
    ></div>
    <div class="extract-progress-copy">
      <div class="extract-progress-label" data-dblp-progress-label>Buscando articulos en DBLP...</div>
      <div class="extract-progress-meta" data-dblp-progress-meta>Consultando el perfil DBLP y preparando la lista de publicaciones.</div>
    </div>
    <div class="extract-progress-value" data-dblp-progress-value>0%</div>
  </div>
  <div class="progress extract-progress-track" aria-hidden="true">
    <div
      class="progress-bar progress-bar-striped progress-bar-animated"
      style="width: 0%;"
      data-dblp-progress-bar
    ></div>
  </div>
</div>
