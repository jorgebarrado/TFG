{% extends "base.html" %}

{% block content %}
<div class="container py-4">
  <h2 class="mb-4">Ajustes de cuenta</h2>

  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags }}">{{ m }}</div>
    {% endfor %}
  {% endif %}

  <div class="row">
    <div class="col-md-6 mb-4">
      <h4 class="mb-3">Datos de perfil</h4>
      <form method="post">
        {% csrf_token %}
        {{ profile_form.as_p }}
        <button name="save_profile" class="btn btn-primary w-100">Guardar cambios</button>
      </form>
    </div>

    <div class="col-md-6 mb-4">
      <h4 class="mb-3">Cambiar contraseña</h4>
      <form method="post">
        {% csrf_token %}
        {{ pwd_form.as_p }}
        <button name="change_password" class="btn btn-warning w-100">Actualizar contraseña</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
