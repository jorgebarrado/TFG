{% extends "base.html" %}
{% load static %}

{% block content %}
<div
  id="reader-root"
  class="reader-root-fullscreen"
  data-api-url="{% url 'api_reader_data' report_id=report_id %}"
  data-pdf-url="{{ pdf_url|default:'' }}"
  data-report-id="{{ report_id }}"
  data-original-doi="{{ citation.doi_original|default:'' }}"
  data-incorrect-doi="{{ citation.doi_incorrect|default:'' }}"
></div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="{% static 'reader/reader.css' %}?v={{ reader_build }}">
<script src="{% static 'reader/reader.js' %}?v={{ reader_build }}"></script>
<script>
  document.body.classList.add("reader-fullscreen");
</script>
{% endblock %}
