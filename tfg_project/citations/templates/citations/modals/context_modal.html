{# templates/citations/modals/context_modal.html #}
<div class="modal fade" id="contextModal" tabindex="-1" aria-labelledby="contextModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 id="contextModalLabel" class="modal-title">Contexto de la Cita</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div id="ctx-loading" class="d-none text-center my-5">
                    <div class="spinner-border" role="status"><span class="visually-hidden">Cargando…</span></div>
                    <p class="mt-2 text-muted">Consultando PDF y extrayendo contextos...</p>
                </div>

                <div id="ctx-error" class="alert alert-danger d-none"></div>

                <div id="ctx-results" class="vstack gap-3">
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-card-text" style="font-size: 3rem;"></i>
                        <p class="mt-3">Pulsa “View context” en una cita para cargar los párrafos donde es mencionada.</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <a id="ctx-create-report" class="btn btn-primary d-none" href="#">Crear reporte con esta cita</a>
                <button type
="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
