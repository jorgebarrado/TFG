{% load i18n %}

<div class="modal fade" id="extractPdfCitationsModal" tabindex="-1"
     aria-labelledby="extractPdfCitationsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-1" id="extractPdfCitationsModalLabel">
            {% trans "Extraer citas de un PDF" %}
          </h5>
          <p class="mb-0 small text-muted">
            {% trans "Sube el PDF del artículo y te mostraremos los fragmentos donde se han detectado posibles citas." %}
          </p>
        </div>
        <button type="button" class="btn-close ms-2" data-bs-dismiss="modal" aria-label="{% trans 'Cerrar' %}"></button>
      </div>

      <div class="modal-body">
        <form id="pdf-extract-form" enctype="multipart/form-data" class="mb-3">
          {% csrf_token %}
          <div class="row g-2 align-items-end">
            <div class="col-md-7">
              <label for="pdf-file-input" class="form-label mb-1">{% trans "Selecciona un archivo PDF" %}</label>
              <input type="file" class="form-control" id="pdf-file-input" name="pdf_file" accept="application/pdf">
            </div>
            <div class="col-md-3">
              <button type="submit" class="btn btn-primary w-100">
                {% trans "Extraer citas" %}
              </button>
            </div>
            <div class="col-md-2 text-end d-none d-md-block">
              <button type="button" class="btn btn-outline-secondary w-100" id="pdf-extract-export-btn" disabled>
                {% trans "Exportar JSON" %}
              </button>
            </div>
          </div>
        </form>

        <div id="pdf-extract-file-summary" class="d-none small text-muted mb-2"></div>

        <div id="pdf-extract-status" class="small text-muted mb-2">
          {% trans "Selecciona un PDF y pulsa \"Extraer citas\"." %}
        </div>

        <div id="pdf-extract-controls" class="border rounded p-2 mb-3 d-none">
          <details id="pdf-extract-filters">
            <summary class="small text-muted mb-2">
              {% trans "Filtros avanzados" %}
            </summary>

            <div class="d-md-flex flex-md-row flex-column gap-2">
              <div class="flex-fill">
                <label class="form-label mb-1 small">{% trans "Buscar en resultados" %}</label>
                <input type="text"
                       id="pdf-extract-search"
                       class="form-control form-control-sm"
                       placeholder="{% trans 'Filtrar por texto (autor, año, palabra...)' %}">
              </div>
              <div class="flex-fill">
                <label class="form-label mb-1 small">{% trans "Filtrar por tipo de cita" %}</label>
                <select id="pdf-extract-pattern-filter"
                        class="form-select form-select-sm">
                  <option value="all">{% trans "Todas las citas" %}</option>
                  <option value="numeric">{% trans "Citas numéricas [n]" %}</option>
                  <option value="author">{% trans "Apellido et al., año" %}</option>
                  <option value="doi">{% trans "DOI en el texto" %}</option>
                </select>
              </div>
              <div class="flex-fill">
                <label class="form-label mb-1 small">{% trans "Sección" %}</label>
                <select id="pdf-extract-section-filter"
                        class="form-select form-select-sm">
                  <option value="all">{% trans "Todo" %}</option>
                  <option value="body">{% trans "Solo cuerpo del artículo" %}</option>
                  <option value="references">{% trans "Solo referencias" %}</option>
                </select>
              </div>
            </div>

            <div class="row g-2 align-items-end mt-2">
              <div class="col-md-4">
                <label class="form-label mb-1 small">{% trans "Página" %}</label>
                <input type="number" min="1" id="pdf-extract-page-filter"
                       class="form-control form-control-sm" placeholder="{% trans 'Todas' %}">
              </div>
              <div class="col-md-4 d-md-none">
                <button type="button" class="btn btn-sm btn-outline-secondary w-100"
                        id="pdf-extract-export-btn-mobile" disabled>
                  {% trans "Exportar JSON" %}
                </button>
              </div>
              <div class="col-md-4 text-md-end">
                <button type="button" class="btn btn-sm btn-outline-secondary w-100"
                        id="pdf-extract-clear-filters">
                  {% trans "Limpiar filtros" %}
                </button>
              </div>
            </div>
          </details>
        </div>

        <div id="pdf-extract-results" class="mt-2" style="max-height: 450px; overflow-y: auto;">
        </div>
      </div>
    </div>
  </div>
</div>
