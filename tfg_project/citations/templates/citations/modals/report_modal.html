<!-- Modal: Nuevo Reporte -->
<div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="reportForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="reportModalLabel">Crear nuevo reporte</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-start">
                    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

                    <!-- DOI original -->
                    <div class="mb-3">
                        <label for="doi_original" class="form-label">DOI original:</label>
                        <input type="text" class="form-control" name="doi_original" id="doi_original" required>
                    
                        <div id="doiOriginalSuccess" class="text-success mt-2 d-none">
                            ✅ DOI válido – metadatos cargados correctamente.
                            <button type="button" class="btn btn-sm btn-outline-secondary ms-2" id="toggleOriginalMetadata">
                                Ver metadatos
                            </button>
                        </div>
                    
                        <div id="doiOriginalPreview" class="mt-3 p-2 border rounded bg-light d-none">
                            <p><strong>Título:</strong> <span id="doiTitleOriginal"></span></p>
                            <p><strong>Autores:</strong> <span id="doiAuthorsOriginal"></span></p>
                            <p><strong>Revista:</strong> <span id="doiJournalOriginal"></span></p>
                            <p><strong>Año:</strong> <span id="doiYearOriginal"></span></p>
                        </div>
                    
                        <div id="doiOriginalError" class="text-danger mt-2 d-none">
                            ⚠️ No se pudieron obtener metadatos del DOI.
                        </div>
                    </div>

                    <!-- DOI incorrecto -->
                    <div class="mb-3">
                        <label for="doi_incorrect" class="form-label">DOI incorrecto:</label>
                        <input type="text" class="form-control" name="doi_incorrect" id="doi_incorrect" required>
                    
                        <div id="doiIncorrectSuccess" class="text-success mt-2 d-none">
                            ✅ DOI válido – metadatos cargados correctamente.
                            <button type="button" class="btn btn-sm btn-outline-secondary ms-2" id="toggleIncorrectMetadata">
                                Ver metadatos
                            </button>
                        </div>
                    
                        <div id="doiIncorrectPreview" class="mt-3 p-2 border rounded bg-light d-none">
                            <p><strong>Título:</strong> <span id="doiTitleIncorrect"></span></p>
                            <p><strong>Autores:</strong> <span id="doiAuthorsIncorrect"></span></p>
                            <p><strong>Revista:</strong> <span id="doiJournalIncorrect"></span></p>
                            <p><strong>Año:</strong> <span id="doiYearIncorrect"></span></p>
                        </div>
                    
                        <div id="doiIncorrectError" class="text-danger mt-2 d-none">
                            ⚠️ No se pudieron obtener metadatos del DOI.
                        </div>
                    </div>

                    <!-- Motivo -->
                    <div class="mb-3">
                        <label for="incorrect_reason" class="form-label">Motivo:</label>
                        <textarea class="form-control" name="incorrect_reason" rows="3" required></textarea>
                    </div>

                    <!-- Tipo de error -->
                    <div class="mb-3">
                        <label for="citation_type" class="form-label">Tipo de error:</label>
                        <select class="form-select" name="citation_type" required>
                            <option value="">Seleccione...</option>
                            <option value="not said">Not Said</option>
                            <option value="misinterpretation">Misinterpretation</option>
                            <option value="contextual misattribution">Contextual Misattribution</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Enviar</button>
                </div>
            </form>
        </div>
    </div>
</div>
