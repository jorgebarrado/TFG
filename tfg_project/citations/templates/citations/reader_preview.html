{% extends "base.html" %}
{% load static %}

{% block content %}
<div
  id="reader-root"
  class="reader-root-fullscreen"
  data-api-url=""
  data-pdf-url="{{ pdf_url|default:'' }}"
  data-debug-enabled="{{ debug_tools_enabled|yesno:'true,false' }}"
></div>
{% endblock %}

{% block scripts %}
{% if reader_vite_url %}
<script type="module" src="{{ reader_vite_url }}/@vite/client"></script>
<script type="module" src="{{ reader_vite_url }}/src/main.jsx"></script>
{% else %}
<link rel="stylesheet" href="{% static 'reader/reader.css' %}?v={{ reader_build }}">
<script src="{% static 'reader/reader.js' %}?v={{ reader_build }}"></script>
{% endif %}
<script>
  document.body.classList.add("reader-fullscreen");
</script>
{% endblock %}
