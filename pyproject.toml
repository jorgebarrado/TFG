[tool.black]
line-length = 88
target-version = ["py311"]
include = "\\.(py)$"

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["citations"]
float_to_top = true

[tool.flake8]
max-line-length = 88
extend-ignore = [
  "E203",  # Slice spacing (compatible con Black)
  "W503",  # line break before binary operator (preferido por Black)
]
exclude = [
  ".git",
  ".venv",
  "venv",
  "migrations",
  "__pycache__",
]
